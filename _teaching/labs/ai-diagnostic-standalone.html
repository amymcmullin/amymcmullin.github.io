<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}</style></head><body><title>AI Certification Diagnostic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one score-report column; exam colors carry meaning, the accent stays for actions */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#15212C; --muted:#56636F; --line:#D8DDE4;
  --accent:#2346A0; --accent-ink:#FFFFFF; --accent-soft:#E2E8F7;
  --gai:#9B3D8F; --az:#1F6FC5; --its:#1E8A6E;
  --good:#1E7F4F; --good-soft:#DFF1E7; --warn:#A56A12; --warn-soft:#F8EDD9; --bad:#B4352F; --bad-soft:#F7E1DF;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#16202A; --ink:#E5EBF1; --muted:#9AA8B5; --line:#2A3846;
  --accent:#93AAF2; --accent-ink:#0E151C; --accent-soft:#1D2944;
  --gai:#D78ACB; --az:#73B0F0; --its:#5FCBA9;
  --good:#62CB8E; --good-soft:#163323; --warn:#E3B260; --warn-soft:#3A2C12; --bad:#EE7C74; --bad-soft:#3E1D1B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#16202A; --ink:#E5EBF1; --muted:#9AA8B5; --line:#2A3846;
  --accent:#93AAF2; --accent-ink:#0E151C; --accent-soft:#1D2944;
  --gai:#D78ACB; --az:#73B0F0; --its:#5FCBA9;
  --good:#62CB8E; --good-soft:#163323; --warn:#E3B260; --warn-soft:#3A2C12; --bad:#EE7C74; --bad-soft:#3E1D1B;
  color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;padding:0 16px}
.wrap{max-width:780px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,5vw,2.6rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.spacer{flex:1}
button,.btn{font:inherit;font-weight:700;font-size:.95rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.link{background:none;border:none;padding:0;color:var(--accent);text-decoration:underline;font-weight:400}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.92rem;flex:1;min-width:180px}
input[type=text],textarea{font:inherit;font-weight:400;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{font-family:var(--mono);font-size:.82rem;min-height:120px;resize:vertical}

/* start */
.exam-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.exam-card{border-top:4px solid var(--c);padding:12px 0 0}
.exam-card b{font-family:var(--display);font-weight:600;font-size:1.02rem;display:block;line-height:1.2}
.exam-card span{font-size:.85rem;color:var(--muted)}
@media (max-width:560px){.exam-trio{grid-template-columns:1fr}}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.92rem}
.facts b{font-family:var(--mono);font-weight:500}

/* quiz */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:2;display:flex;flex-direction:column;gap:8px}
.track{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.stem{font-size:1.15rem;line-height:1.5}
.hint{font-size:.85rem;font-weight:700;color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.opt .letter{font-family:var(--mono);font-size:.85rem;color:var(--muted);margin-top:2px}
.grid-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.grid-nav button{padding:6px 0;font-family:var(--mono);font-weight:500;font-size:.8rem}
.grid-nav button.done{background:var(--accent-soft);border-color:var(--accent)}
.grid-nav button.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.grid-nav button.cur{outline:2px solid var(--ink)}

/* results */
.verdict{border-left:6px solid var(--c);padding:18px 22px}
.verdict .big{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4.5vw,2.1rem);line-height:1.1}
.meters{display:flex;flex-direction:column;gap:16px}
.meter{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.meter .nm{font-weight:700}
.meter .pct{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;position:relative;height:12px;background:var(--bg);border:1px solid var(--line);border-radius:99px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--c)}
.bar .cut{position:absolute;top:-5px;bottom:-5px;left:75%;width:2px;background:var(--ink)}
.cutlbl{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-align:right}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.b-ready{background:var(--good-soft);color:var(--good)} .b-close{background:var(--warn-soft);color:var(--warn)}
.b-dev{background:var(--bad-soft);color:var(--bad)} .b-not{background:var(--bad-soft);color:var(--bad)}
.topics{display:grid;grid-template-columns:minmax(0,1fr) 110px 46px;gap:8px 12px;align-items:center;font-size:.93rem}
.topics .mini{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:99px;position:relative}
.topics .mini i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.topics .n{font-family:var(--mono);font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums}
.dots{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.plan{counter-reset:p;display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.plan li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 10px}
.plan li::before{counter-increment:p;content:counter(p);font-family:var(--mono);font-size:.85rem;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;grid-row:span 3}
.plan .obj{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.codebox{font-family:var(--mono);font-size:.82rem;word-break:break-all;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:12px}
details.rev{border-top:1px solid var(--line);padding-block:10px}
details.rev summary{cursor:pointer;display:flex;gap:10px;align-items:baseline}
details.rev summary::marker{content:""}
.mark{font-family:var(--mono);font-weight:500;width:20px;flex:none}
.mark.y{color:var(--good)} .mark.n{color:var(--bad)}
.rev ul{margin:8px 0;padding-left:20px;font-size:.93rem}
.rev li.key{font-weight:700;color:var(--good)} .rev li.wrong{color:var(--bad);text-decoration:line-through}
.why{font-size:.9rem;color:var(--muted)}

/* teacher */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:760px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--mono);font-weight:500;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chip{display:inline-block;min-width:44px;text-align:center;font-family:var(--mono);font-size:.8rem;padding:2px 6px;border-radius:6px}
.examtag{font-weight:700;color:var(--c)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:800}
.stat span{font-size:.82rem;color:var(--muted)}
.notice{font-size:.85rem;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink)}
.foot{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main class="wrap" id="app"></main>

<script>
const BANK = {"exams": {"GAI": {"name": "Generative AI Foundations", "vendor": "Certiport / Pearson (Critical Career Skills)", "weights": {"FND": 0.05, "GEN": 0.15, "PRM": 0.3, "CRT": 0.2, "VER": 0.1, "ETH": 0.2}}, "AZ": {"name": "Azure AI Fundamentals (AI-901)", "vendor": "Microsoft", "weights": {"FND": 0.05, "GEN": 0.2, "PRM": 0.15, "ETH": 0.15, "AZR": 0.45}}, "ITS": {"name": "IT Specialist: Artificial Intelligence", "vendor": "Certiport / Pearson", "weights": {"FND": 0.15, "ETH": 0.1, "DAT": 0.3, "MOD": 0.25, "OPS": 0.2}}}, "topics": {"FND": {"name": "AI & Machine Learning Foundations", "study": "Know the ML task types: classification, regression, clustering, reinforcement learning, supervised vs. unsupervised. Also know when generative AI fits better than predictive AI or a search engine.", "objectives": "GAI 1.1 · AI-901 Identify AI workloads · ITS 1.1–1.2"}, "GEN": {"name": "How Generative AI Works", "study": "Tokens, embeddings, LLMs vs. diffusion models; what training requires (data, GPUs, energy); model parameters such as temperature and max tokens.", "objectives": "GAI 1.1–1.2 · AI-901 Identify AI model components and configurations"}, "PRM": {"name": "Prompt Engineering & Refinement", "study": "Zero-shot, few-shot, chain-of-thought, self-consistency, generate knowledge, prompt chaining, reverse prompting. Improve prompts with content, style, persona and context; know what system prompts do.", "objectives": "GAI 3.1–3.4 · AI-901 Create effective system and user prompts"}, "CRT": {"name": "Creating & Transforming Content", "study": "Choosing prompts for text, image and video tasks (summarize, reformat, translate, subtitle, avatar, colorize) and choosing a tool (privacy, cost, licensing, output control).", "objectives": "GAI 1.3–1.5, 2.1–2.4"}, "VER": {"name": "Verifying Output & Limitations", "study": "Hallucinations, inconsistency, outdated knowledge; how to verify historical facts, current facts and numerical data against reliable sources.", "objectives": "GAI 1.6, 3.5"}, "ETH": {"name": "Responsible AI, Ethics, Law & Privacy", "study": "Microsoft's six Responsible AI principles; sources of bias; intellectual property; PII and data privacy; who is accountable for AI output.", "objectives": "GAI 4.1–4.5 · AI-901 Responsible AI · ITS 3.6, 5.3"}, "AZR": {"name": "Azure AI Services & Microsoft Foundry", "study": "Vision (object detection, OCR), Azure AI Language, Azure Speech, Content Understanding, grounding/RAG, and agents in Microsoft Foundry.", "objectives": "AI-901 Identify AI workloads; Implement AI solutions using Microsoft Foundry"}, "DAT": {"name": "Data Collection & Preparation", "study": "Data quality issues (missing values, outliers, invalid entries), encoding categorical data, text features (bag-of-words, TF-IDF), train/test splits, stratification.", "objectives": "ITS 2.1–2.9"}, "MOD": {"name": "Model Training & Evaluation", "study": "Overfitting vs. underfitting, ways to prevent overfitting, classification metrics (precision, recall, F1) vs. regression metrics (MAE, RMSE).", "objectives": "ITS 3.1–3.5"}, "OPS": {"name": "Deployment, Monitoring & Lifecycle", "study": "Data drift vs. concept drift, logging and monitoring, retraining triggers, documentation, change control and scope creep.", "objectives": "ITS 1.6, 2.4, 4.1–4.4, 5.1–5.5"}}, "items": [{"id": "FND1", "topic": "FND", "type": "mc", "stem": "A real estate company wants to predict the sale price of a home from its square footage, number of bedrooms, and location. What type of machine learning task is this?", "options": ["Classification", "Regression", "Clustering", "Reinforcement learning"], "answer": [1], "why": "The output is a continuous number (a price), so this is regression. Classification predicts a category."}, {"id": "FND2", "topic": "FND", "type": "mc", "stem": "A gym has check-in data for 3,000 members but no labels or categories. Management wants AI to discover groups of members with similar workout habits. Which technique fits best?", "options": ["Regression", "Clustering", "Anomaly detection", "Supervised classification"], "answer": [1], "why": "Clustering is unsupervised: it groups similar records when no labels exist."}, {"id": "FND3", "topic": "FND", "type": "mc", "stem": "A warehouse robot gets a reward each time it delivers a package faster than before. Over thousands of trips it learns better routes. Which learning approach is this?", "options": ["Reinforcement learning", "Unsupervised learning", "Supervised learning", "Rule-based programming"], "answer": [0], "why": "Learning by trial and error from rewards and penalties is reinforcement learning."}, {"id": "FND4", "topic": "FND", "type": "ma", "stem": "Which TWO tasks are better suited to generative AI than to a search engine or a predictive model? (Choose two.)", "options": ["Drafting a first version of a cover letter for a help-desk job", "Finding the Collier County tax office's hours for today", "Predicting whether a loan applicant will miss a payment", "Creating three logo concept images for a new food truck"], "answer": [0, 3], "why": "Generative AI creates new content (text, images). Current official facts belong to a search engine; a yes/no risk prediction is predictive AI."}, {"id": "GEN1", "topic": "GEN", "type": "mc", "stem": "In a large language model (LLM), what is a token?", "options": ["A password used to access the model", "A label a person adds to a training example", "A small unit of text, such as a word or part of a word, that the model processes", "A score showing how accurate a response is"], "answer": [2], "why": "LLMs break text into tokens (words or word pieces). Prompt length, output length and cost are all measured in tokens."}, {"id": "GEN2", "topic": "GEN", "type": "mc", "stem": "What is the purpose of embeddings in a generative AI solution?", "options": ["They encrypt prompts before they are sent to the model", "They represent text as numeric vectors so that content with similar meaning ends up close together", "They compress images to reduce storage", "They count how many words are in a document"], "answer": [1], "why": "Embeddings turn meaning into numbers. Semantic search and retrieval-augmented generation (RAG) depend on them."}, {"id": "GEN3", "topic": "GEN", "type": "mc", "stem": "A developer wants a help-desk chatbot to give consistent, predictable answers to the same question. Which configuration change helps most?", "options": ["Remove the system prompt", "Raise the temperature", "Lower the temperature", "Increase the max tokens setting"], "answer": [2], "why": "Temperature controls randomness. A lower value gives more focused, repeatable answers; a higher value gives more creative, varied ones."}, {"id": "GEN4", "topic": "GEN", "type": "ma", "stem": "Which TWO statements about training generative AI models are true? (Choose two.)", "options": ["Once trained, an LLM automatically knows about events that happened after training", "An LLM can be trained effectively on a few hundred sentences", "Image generation models are commonly trained on images paired with text descriptions", "Training a large model takes powerful hardware such as GPUs and uses a lot of energy"], "answer": [2, 3], "why": "Large models need huge datasets and heavy GPU compute, and image models learn from text-image pairs. Training data has a cutoff, so the model doesn't know about later events."}, {"id": "GEN5", "topic": "GEN", "type": "mc", "stem": "Which type of model creates an image by starting from random noise and refining it step by step until it matches the prompt?", "options": ["k-means", "Linear regression", "Diffusion model", "Decision tree"], "answer": [2], "why": "Diffusion models generate images by removing noise step by step. Most modern image generators use them."}, {"id": "PRM1", "topic": "PRM", "type": "mc", "stem": "Which prompt is an example of few-shot prompting?", "options": ["“Write a slogan for a dog-grooming business.”", "“Think step by step about what pet owners want, then write a slogan.”", "“Here are two slogans we like: ‘Fresh fur, happy tails’ and ‘Clean pups, big smiles.’ Write three more in the same style.”", "“Write a slogan, then rewrite it to be shorter.”"], "answer": [2], "why": "Few-shot prompts include a few examples of the output you want. The plain request is zero-shot, “think step by step” is chain-of-thought, and write-then-shorten is a simple prompt chain."}, {"id": "PRM2", "topic": "PRM", "type": "mc", "stem": "A student writes: “Solve this budget problem. Show your reasoning one step at a time before giving the final total.” Which prompting technique is this?", "options": ["Zero-shot", "Reverse prompting", "Chain-of-thought", "Self-consistency"], "answer": [2], "why": "Asking the model to reason through steps before answering is chain-of-thought prompting."}, {"id": "PRM3", "topic": "PRM", "type": "mc", "stem": "A student runs the same math word-problem prompt five times and goes with the answer that comes up most often. Which technique is this?", "options": ["Self-consistency", "Prompt chaining", "Generate knowledge", "Few-shot"], "answer": [0], "why": "Self-consistency means generating several responses to the same prompt and choosing the most consistent answer."}, {"id": "PRM4", "topic": "PRM", "type": "mc", "stem": "Which is an example of reverse prompting?", "options": ["Asking the AI to translate its answer into Spanish", "Asking the AI to list facts about a topic before writing about it", "Typing the prompt in reverse word order", "Pasting a sample product description and asking, “What prompt would produce text like this?”"], "answer": [3], "why": "Reverse prompting works backward from a desired output to the prompt that produces it. Asking for facts before writing is the generate-knowledge technique."}, {"id": "PRM5", "topic": "PRM", "type": "ma", "stem": "The prompt “Write about solar panels” returns generic text. You need a piece for a homeowners' newsletter. Which TWO changes would most improve the output? (Choose two.)", "options": ["Shorten the prompt to “Solar?”", "Run the same prompt again without changes", "Assign a persona: “You are a friendly energy-savings advisor”", "Add context: “for Florida homeowners considering installation, about 200 words”"], "answer": [2, 3], "why": "Adding context (audience, purpose, length) and a persona or style are the main ways to refine a prompt for targeted output."}, {"id": "PRM6", "topic": "PRM", "type": "mc", "stem": "In a Microsoft Foundry chat app, where should you put the instruction that the assistant must always act as a polite IT help-desk agent and decline unrelated requests?", "options": ["In the temperature setting", "In the system prompt (system message)", "In each user's message", "In the model's training data"], "answer": [1], "why": "The system prompt sets the assistant's role, tone and rules for the whole conversation. User prompts carry each individual request."}, {"id": "CRT1", "topic": "CRT", "type": "mc", "stem": "An instructor needs a recorded lecture to be usable by viewers who cannot hear the audio. Which AI prompt fits best?", "options": ["“Add upbeat background music to this video.”", "“Generate an avatar that reads this lecture aloud.”", "“Generate accurate subtitles synchronized with the speech in this video.”", "“Colorize this video.”"], "answer": [2], "why": "Automated subtitling (captions) makes video content accessible without audio."}, {"id": "CRT2", "topic": "CRT", "type": "mc", "stem": "An AI response lists the annual rainfall for 12 cities in one long paragraph. Which follow-up prompt will make the data easiest to read?", "options": ["“Rewrite the paragraph with more detail.”", "“Convert this into a table with columns for City and Annual Rainfall, sorted highest to lowest.”", "“Translate this into Spanish.”", "“Make this sound more exciting.”"], "answer": [1], "why": "Reformatting content into a structure that suits it, such as a table, is a core content-transformation prompt."}, {"id": "CRT3", "topic": "CRT", "type": "ma", "stem": "A small business is choosing a generative AI tool to make marketing images. Which TWO considerations matter most? (Choose two.)", "options": ["How the tool handles uploaded data and whether it is used for training", "Whether the license allows commercial use of the generated images", "The color of the tool's logo", "How many social media followers the tool's company has"], "answer": [0, 1], "why": "Purpose and licensing, data privacy and security, cost, quality and output controls are the key tool-selection factors."}, {"id": "VER1", "topic": "VER", "type": "mc", "stem": "A chatbot confidently cites a court case, with a name and date, that never existed. What is this called?", "options": ["Tokenization", "Hallucination", "Overfitting", "Data drift"], "answer": [1], "why": "A hallucination is output that sounds plausible but is false or made up."}, {"id": "VER2", "topic": "VER", "type": "ma", "stem": "A writer uses a generative AI tool to collect facts about this week's local news for a newsletter. Which TWO steps best verify the facts? (Choose two.)", "options": ["Assume the facts are correct if they are detailed", "Open any sources the AI cites and confirm they exist, are recent, and say what the AI claims", "Cross-check each fact against reputable, current news sources", "Ask the same chatbot, “Are you sure?”"], "answer": [1, 2], "why": "Current facts must be checked against independent, up-to-date sources. The model may have a training cutoff or invent sources."}, {"id": "VER3", "topic": "VER", "type": "mc", "stem": "An AI-generated image of a classroom shows two wall clocks set to different times, and one student has six fingers. Which limitation of generative AI does this show?", "options": ["Bias in training data", "Copyright infringement", "Inconsistent or illogical details in generated output", "Data leakage"], "answer": [2], "why": "Generative models predict patterns rather than understanding the real world, so their output can contain inconsistent or impossible details. People still have to review it."}, {"id": "ETH1", "topic": "ETH", "type": "mc", "stem": "A loan-approval model approves applicants from one neighborhood far less often than applicants with similar finances elsewhere. Which Responsible AI principle is most directly at issue?", "options": ["Fairness", "Transparency", "Inclusiveness", "Reliability and safety"], "answer": [0], "why": "Fairness means AI systems treat similar people similarly and avoid biased outcomes for groups."}, {"id": "ETH2", "topic": "ETH", "type": "mc", "stem": "Which Responsible AI principle requires telling users how a model reaches its decisions and what its limitations are?", "options": ["Inclusiveness", "Privacy and security", "Accountability", "Transparency"], "answer": [3], "why": "Transparency means people can understand how an AI system works and where its limits are."}, {"id": "ETH3", "topic": "ETH", "type": "ma", "stem": "An employee pastes a customer list with names, addresses, and Social Security numbers into a free public chatbot to format it. Which TWO risks does this create? (Choose two.)", "options": ["The data is automatically encrypted and deleted", "Exposed PII could lead to identity theft and civil or criminal liability", "The chatbot will refuse to format any table", "The data may be stored or used to train the model"], "answer": [1, 3], "why": "Public tools may keep prompts and train on them. Leaking personally identifiable information (PII) creates identity-theft and legal risk, which is why companies set AI-use policies."}, {"id": "ETH4", "topic": "ETH", "type": "mc", "stem": "A company wants to train a model on product descriptions from manufacturers' websites, and some of that text is copyrighted. What is the proper approach?", "options": ["Remove the company logos and use the rest", "Get permission or licenses from the copyright holders", "Paraphrase the text first so it no longer counts", "Use it freely, si const ITEMS = BANK.items, TOPICS = BANK.topics, EXAMS = BANK.exams;
const EXAM_KEYS = ["GAI","AZ","ITS"];
const EXAM_COLOR = {GAI:"var(--gai)", AZ:"var(--az)", ITS:"var(--its)"};
const READY = 75, CLOSE = 60, DEV = 40;
const SAVE_KEY = "aidx-attempt-v1";
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const keyMask = it => it.answer.reduce((m,a)=>m|(1<<a),0);
const need = it => it.answer.length;

/* ---------- scoring (pure) ---------- */
function score(masks){ // masks: array aligned with ITEMS (canonical option indices)
  const topic = {};
  for (const t in TOPICS) topic[t] = {n:0, c:0};
  const correct = ITEMS.map((it,i)=> masks[i] === keyMask(it));
  ITEMS.forEach((it,i)=>{ topic[it.topic].n++; if(correct[i]) topic[it.topic].c++; });
  for (const t in topic) topic[t].pct = topic[t].n ? topic[t].c/topic[t].n : 0;
  const exam = {};
  for (const e of EXAM_KEYS){
    const w = EXAMS[e].weights; let s = 0;
    for (const t in w) s += w[t]*topic[t].pct;
    exam[e] = Math.round(s*100);
  }
  const ranked = EXAM_KEYS.slice().sort((a,b)=> exam[b]-exam[a]);
  const total = correct.filter(Boolean).length;
  return {topic, exam, ranked, best: ranked[0], correct, total, overall: Math.round(100*total/ITEMS.length)};
}
function band(p){ return p>=READY?{k:"ready",t:"Likely ready",c:"b-ready"}: p>=CLOSE?{k:"close",t:"Almost there",c:"b-close"}: p>=DEV?{k:"dev",t:"Developing",c:"b-dev"}:{k:"not",t:"Not yet",c:"b-not"}; }
function studyPlan(r, e){
  const w = EXAMS[e].weights;
  return Object.keys(w).map(t=>({t, w:w[t], pct:r.topic[t].pct, gain:w[t]*(1-r.topic[t].pct)}))
    .filter(x=> x.pct < 0.8).sort((a,b)=> b.gain-a.gain);
}

/* ---------- results code ---------- */
function fnv(s){ let h=0x811c9dc5; for(const ch of s){ h^=ch.codePointAt(0); h=Math.imul(h,0x01000193)>>>0;} return h; }
function b64u(str){ return btoa(String.fromCharCode(...new TextEncoder().encode(str))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))); }
function makeCode(rec){
  const clean = v => String(v).replace(/~/g,"-").trim().slice(0,60);
  const payload = ["1", clean(rec.name), clean(rec.period), rec.date, rec.minutes, rec.masks.map(m=>m.toString(16)).join("")].join("~");
  return "AIDX-" + b64u(payload) + "." + (fnv("itech-ai|"+payload)%1679616).toString(36).padStart(4,"0");
}
function parseCodes(text){
  const out=[], seen=new Set(); let bad=0;
  for (const m of text.matchAll(/AIDX-([A-Za-z0-9_-]+)\.([a-z0-9]{4})/g)){
    if (seen.has(m[0])) continue; seen.add(m[0]);
    try{
      const payload = unb64u(m[1]); const p = payload.split("~");
      if (p[0]!=="1" || p.length!==6 || p[5].length!==ITEMS.length) throw 0;
      const ok = (fnv("itech-ai|"+payload)%1679616).toString(36).padStart(4,"0")===m[2];
      out.push({name:p[1], period:p[2], date:p[3], minutes:+p[4], masks:[...p[5]].map(h=>parseInt(h,16)), verified:ok, code:m[0]});
    }catch(e){ bad++; }
  }
  return {rows:out, bad};
}

/* ---------- Canvas "Student Analysis" CSV ---------- */
function csvRows(text){
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(f); f=""; }
    else if (c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if (f!==""||row.length){ row.push(f); rows.push(row); }
  return rows;
}
const norm = s => String(s).toLowerCase().replace(/<[^>]*>/g,"").replace(/&[a-z#0-9]+;/g,"").replace(/[^a-z0-9]/g,"").slice(0,60);
function parseCanvas(text){
  const rows = csvRows(text); if (rows.length<2) return [];
  const h = rows[0].map(x=>x.trim());
  const nameCol = h.findIndex(x=>x.toLowerCase()==="name");
  if (nameCol<0) return [];
  const secCol = h.findIndex(x=>x.toLowerCase()==="section");
  const subCol = h.findIndex(x=>x.toLowerCase()==="submitted");
  const byStem = new Map(ITEMS.map((it,i)=>[norm(it.stem),i]));
  const map = []; // [colIndex of score, itemIndex]
  h.forEach((x,c)=>{ const m = x.match(/^\d+:\s*([\s\S]+)/); if(!m) return; const i = byStem.get(norm(m[1])); if(i!==undefined) map.push([c+1,i]); });
  if (!map.length) return [];
  return rows.slice(1).filter(r=> r[nameCol] && r[nameCol].trim()).map(r=>{
    const masks = ITEMS.map(()=>0);
    for (const [c,i] of map){ const v = parseFloat(r[c]); if (v>=0.999) masks[i] = keyMask(ITEMS[i]); }
    const sub = subCol>=0 ? (r[subCol]||"").slice(0,10) : "";
    return {name:r[nameCol].trim(), period: secCol>=0?(r[secCol]||"").trim():"", date:sub, minutes:0, masks, verified:true, code:"canvas:"+r[nameCol], canvas:true, matched:map.length};
  });
}

/* ---------- attempt state ---------- */
let S = null;
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function newAttempt(name, period){
  return {name, period, order: shuffle(ITEMS.map((_,i)=>i)),
    perm: ITEMS.map(it=> shuffle(it.options.map((_,k)=>k))),
    masks: ITEMS.map(()=>0), flags: ITEMS.map(()=>false), idx:0, start: Date.now(), end:null};
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const s = JSON.parse(localStorage.getItem(SAVE_KEY)||"null"); if(s && s.masks && s.masks.length===ITEMS.length) return s; }catch(e){} return null; }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
const answeredCount = () => S.masks.filter((m,i)=> popcount(m)===need(ITEMS[i])).length;
function popcount(m){ let c=0; while(m){ c+=m&1; m>>=1;} return c; }

}

function meterHTML(e, pct){
  const b = band(pct);
  return `<div class="meter" style="--c:${EXAM_COLOR[e]}"><span class="nm">${esc(EXAMS[e].name)}</span>
    <span><span class="pill ${b.c}">${b.t}</span> <span class="pct">${pct}%</span></span>
    <div class="bar" role="img" aria-label="${pct} percent readiness"><i style="width:${pct}%"></i><span class="cut"></span></div></div>`;
}
function topicRows(r){
  return Object.keys(TOPICS).map(t=>{
    const p = Math.round(r.topic[t].pct*100);
    const col = p>=80?"var(--good)":p>=60?"var(--warn)":"var(--bad)";
    const dots = EXAM_KEYS.filter(e=> EXAMS[e].weights[t]).map(e=>`<i style="--c:${EXAM_COLOR[e]}" title="${esc(EXAMS[e].name)}"></i>`).join("");
    return `<span>${esc(TOPICS[t].name)}<span class="dots">${dots}</span></span><div class="mini"><i style="width:${p}%;background:${col}"></i></div><span class="n">${r.topic[t].c}/${r.topic[t].n}</span>`;
  }).join("");
}

function viewResults(){
  const r = score(S.masks), best = r.best, second = r.ranked[1], bb = band(r.exam[best]);
  const plan = studyPlan(r, best);
  const minutes = Math.max(1, Math.round((S.end - S.start)/60000));
  const code = makeCode({name:S.name, period:S.period||"", date:new Date(S.end).toISOString().slice(0,10), minutes, masks:S.masks});
  let headline;
  if (bb.k==="ready") headline = `You're on track to pass ${EXAMS[best].name}.`;
  else if (bb.k==="close") headline = `${EXAMS[best].name} is your closest exam. A focused review should get you there.`;
  else headline = `${EXAMS[best].name} is your best starting point. Build these topics before you schedule it.`;
  app.innerHTML = `
  <header class="stack">
    <div class="eyebrow">Score report · ${esc(S.name)}${S.period?" · "+esc(S.period):""} · ${minutes} min</div>
    <h1>${r.total} of ${ITEMS.length} correct</h1>
  </header>
  <section class="panel verdict stack" style="--c:${EXAM_COLOR[best]}">
    <div class="eyebrow">Recommended exam</div>
    <div class="big">${esc(EXAMS[best].name)}</div>
    <p>${esc(headline)} Next closest: <b>${esc(EXAMS[second].name)}</b> at ${r.exam[second]}%.</p>
  </section>
  <section class="panel stack">
    <div class="row"><h2>Exam readiness</h2><span class="spacer"></span><span class="cutlbl">line = ${READY}% readiness target</span></div>
    <div class="meters">${r.ranked.map(e=> meterHTML(e, r.exam[e])).join("")}</div>
    <p class="muted" style="font-size:.86rem">Each exam's readiness weights your topic scores by how much of that exam the topic covers.</p>
  </section>
  <section class="panel stack">
    <h2>Study plan for ${esc(EXAMS[best].name)}</h2>
    ${plan.length?`<p class="muted">Ordered by how many points each topic is worth on this exam.</p><ol class="plan">${plan.map(x=>`<li><b>${esc(TOPICS[x.t].name)} · ${Math.round(x.pct*100)}%</b><span>${esc(TOPICS[x.t].study)}</span><span class="obj">${esc(TOPICS[x.t].objectives)}</span></li>`).join("")}</ol>`
      :`<p>You scored 80% or higher on every topic this exam covers. Take a full-length practice test, then schedule the exam.</p>`}
  </section>
  <section class="panel stack">
    <h2>Topic scores</h2>
    <p class="muted" style="font-size:.86rem">Dots show which exams test each topic: <span class="dots">${EXAM_KEYS.map(e=>`<i style="--c:${EXAM_COLOR[e]}"></i>`).join("")}</span> ${EXAM_KEYS.map(e=>`<span class="examtag" style="--c:${EXAM_COLOR[e]}">${e==="AZ"?"AI-901":e==="GAI"?"GenAI":"ITS"}</span>`).join(" · ")}</p>
    <div class="topics">${topicRows(r)}</div>
  </section>
  <section class="panel stack">
    <h2>Turn in your results code</h2>
    <p>Copy this code and paste it where your teacher asked (Canvas assignment or form).</p>
    <div class="codebox" id="code">${esc(code)}</div>
    <div class="row"><button class="primary" id="copy">Copy code</button><span id="copied" class="muted" aria-live="polite"></span></div>
  </section>
  <section class="panel">
    <details><summary style="cursor:pointer"><h2 style="display:inline">Review your answers</h2></summary>
    <div style="margin-top:10px">${S.order.map((q,p)=>{
      const it = ITEMS[q], ok = r.correct[q];
      return `<details class="rev"><summary><span class="mark ${ok?"y":"n"}">${ok?"✓":"✗"}</span><span>${p+1}. ${esc(it.stem)}</span></summary>
        <ul>${it.options.map((o,k)=>{ const key=it.answer.includes(k), mine=(S.masks[q]>>k)&1; return `<li class="${key?"key":mine?"wrong":""}">${esc(o)}${mine?" (your answer)":""}</li>`;}).join("")}</ul>
        <p class="why">${esc(it.why)}</p></details>`;}).join("")}</div></details>
  </section>
  <div class="row"><button id="again">Start a new attempt</button></div>
  ${footer()}`;
  document.getElementById("copy").onclick = async ()=>{
    const out = document.getElementById("copied");
    try{ await navigator.clipboard.writeText(code); out.textContent="Copied."; }
    catch(e){ const rg=document.createRange(); rg.selectNodeContents(document.getElementById("code")); const s=getSelection(); s.removeAllRanges(); s.addRange(rg); out.textContent="Selected. Press Ctrl+C to copy."; }
  };
  document.getElementById("again").onclick = ()=>{ clearSave(); S=null; viewStart(); };
  document.getElementById("toTeacher").onclick = viewTeacher;
}

/* ---------- teacher ---------- */
let T = {rows:[], sort:"name", dir:1, example:false};
function exampleCodes(){
  const names = ["Example Student A","Example Student B","Example Student C","Example Student D","Example Student E","Example Student F"];
  const strengths = [["PRM","CRT","VER","ETH","GEN"],["AZR","GEN","ETH","PRM"],["DAT","MOD","OPS","FND"],["FND","PRM","ETH"],["DAT","MOD","FND","ETH","OPS","AZR"],["CRT","VER","PRM","ETH","GEN","AZR"]];
  let seed = 7; const rnd = ()=> (seed = (seed*16807)%2147483647)/2147483647;
  return names.map((n,s)=> makeCode({name:n, period:"EXAMPLE", date:"2026-10-01", minutes:28+s*3,
    masks: ITEMS.map(it=> rnd() < (strengths[s].includes(it.topic)?0.88:0.4) ? keyMask(it) : (1<<((it.answer[0]+1)%4)) | (it.type==="ma"?1<<((it.answer[0]+2)%4):0))
  })).join("\n");
}
function viewTeacher(){
  app.innerHTML = `
  <header class="stack"><div class="eyebrow">Teacher view</div><h1>Class results</h1>
    <p class="muted" style="max-width:62ch">Paste results codes from Canvas or a form. You can paste a whole export: the page finds the codes inside it. If you gave the test as a Canvas quiz, open its Student Analysis CSV instead. Nothing you paste leaves this browser.</p></header>
  <section class="panel stack">
    <label class="field" for="codes">Results codes<textarea id="codes" placeholder="AIDX-…"></textarea></label>
    <div class="row"><button class="primary" id="go">Show results</button><label class="btn" for="file" style="cursor:pointer">Open a .csv or .txt file</label><input type="file" id="file" accept=".csv,.txt,text/plain,text/csv" hidden>
      <span class="spacer"></span><button id="ex">Load example class</button><button id="back">Back to the test</button></div>
    <p id="parseMsg" class="muted" aria-live="polite"></p>
  </section>
  <div id="tout" class="stack"></div>`;
  const ta = document.getElementById("codes");
  const run = ()=>{ const {rows:codeRows,bad} = parseCodes(ta.value); const canvasRows = parseCanvas(ta.value);
    const rows = codeRows.concat(canvasRows);
    T.rows = rows.map(x=>({...x, r:score(x.masks)})); T.example = rows.some(r=>r.period==="EXAMPLE");
    const cv = canvasRows.length ? ` Canvas report: ${canvasRows.length} student${canvasRows.length>1?"s":""}, ${canvasRows[0].matched} of ${ITEMS.length} questions matched.` : "";
    document.getElementById("parseMsg").textContent = rows.length ? `${rows.length} result${rows.length>1?"s":""} loaded${bad?`, ${bad} code${bad>1?"s":""} could not be read`:""}.${cv}` : (bad?`${bad} code(s) could not be read. Check that each one was copied in full.`:"No results found. Paste codes that start with AIDX-, or open the Canvas Student Analysis CSV.");
    renderTeacher(); };
  document.getElementById("go").onclick = run;
  document.getElementById("ex").onclick = ()=>{ ta.value = exampleCodes(); run(); };
  document.getElementById("file").onchange = ev=>{ const f=ev.target.files[0]; if(!f) return; f.text().then(t=>{ ta.value=t; run(); }); };
  document.getElementById("back").onclick = ()=> S && !S.end ? viewQuiz() : S && S.end ? viewResults() : viewStart();
  if (T.rows.length) renderTeacher();
}
function renderTeacher(){
  const out = document.getElementById("tout"); if(!out) return;
  const rows = T.rows; if(!rows.length){ out.innerHTML=""; return; }
  const avg = f => Math.round(rows.reduce((s,x)=>s+f(x),0)/rows.length);
  const recCount = Object.fromEntries(EXAM_KEYS.map(e=>[e, rows.filter(x=>x.r.best===e).length]));
  const readyCount = rows.filter(x=> x.r.exam[x.r.best]>=READY).length;
  const topicAvg = Object.keys(TOPICS).map(t=>({t, p: rows.reduce((s,x)=>s+x.r.topic[t].pct,0)/rows.length})).sort((a,b)=>a.p-b.p);
  const itemPct = ITEMS.map((it,i)=>({it, p: rows.filter(x=>x.r.correct[i]).length/rows.length})).sort((a,b)=>a.p-b.p).slice(0,6);
  const sorted = rows.slice().sort((a,b)=>{
    const k=T.sort, d=T.dir;
    const v = x => k==="name"?x.name.toLowerCase(): k==="period"?x.period.toLowerCase(): k==="date"?x.date: k==="overall"?x.r.overall: k==="rec"?x.r.best: x.r.exam[k];
    return v(a)>v(b)?d: v(a)<v(b)?-d:0;});
  const chip = p => { const b=band(p); return `<span class="chip ${b.c}">${p}%</span>`; };
  const th = (k,l)=>`<th data-k="${k}" aria-sort="${T.sort===k?(T.dir>0?"ascending":"descending"):"none"}">${l}${T.sort===k?(T.dir>0?" ▲":" ▼"):""}</th>`;
  out.innerHTML = `
  ${T.example?`<p class="notice">These are example students generated to show the layout. They are not real results.</p>`:""}
  ${rows.some(x=>!x.verified)?`<p class="notice">${rows.filter(x=>!x.verified).length} code(s) failed the check digits and may have been edited. They are marked with ⚠.</p>`:""}
  <section class="stats">
    <div class="stat"><b>${rows.length}</b><span>students</span></div>
    <div class="stat"><b>${avg(x=>x.r.overall)}%</b><span>average score</span></div>
    <div class="stat"><b>${readyCount}</b><span>likely ready for their recommended exam</span></div>
    ${EXAM_KEYS.map(e=>`<div class="stat" style="border-top:4px solid ${EXAM_COLOR[e]}"><b>${recCount[e]}</b><span>recommended ${esc(EXAMS[e].name)}</span></div>`).join("")}
  </section>
  <div class="tablewrap"><table>
    <thead><tr>${th("name","Student")}${th("period","Class")}${th("date","Date")}${th("overall","Score")}${th("GAI","GenAI")}${th("AZ","AI-901")}${th("ITS","ITS AI")}${th("rec","Recommended")}<th>Study first</th></tr></thead>
    <tbody>${sorted.map(x=>{ const pl = studyPlan(x.r, x.r.best).slice(0,2);
      return `<tr><td>${x.verified?"":"⚠ "}${esc(x.name)}</td><td>${esc(x.period)}</td><td class="num">${esc(x.date)}</td><td class="num">${x.r.total}/${ITEMS.length}</td>
      ${EXAM_KEYS.map(e=>`<td>${chip(x.r.exam[e])}</td>`).join("")}
      <td><span class="examtag" style="--c:${EXAM_COLOR[x.r.best]}">${esc(EXAMS[x.r.best].name)}</span></td>
      <td>${pl.length?pl.map(p=>esc(TOPICS[p.t].name)).join("<br>"):"Ready to test"}</td></tr>`;}).join("")}</tbody>
  </table></div>
  <div class="row"><button id="csv">Download CSV</button><button id="copycsv">Copy as CSV</button><span id="csvMsg" class="muted" aria-live="polite"></span></div>
  <section class="panel stack"><h2>Class topic averages</h2><p class="muted" style="font-size:.86rem">Weakest first. Dots show which exams test the topic.</p>
    <div class="topics">${topicAvg.map(({t,p})=>{ const q=Math.round(p*100); const col=q>=80?"var(--good)":q>=60?"var(--warn)":"var(--bad)";
      return `<span>${esc(TOPICS[t].name)}<span class="dots">${EXAM_KEYS.filter(e=>EXAMS[e].weights[t]).map(e=>`<i style="--c:${EXAM_COLOR[e]}"></i>`).join("")}</span></span><div class="mini"><i style="width:${q}%;background:${col}"></i></div><span class="n">${q}%</span>`;}).join("")}</div>
  </section>
  <section class="panel stack"><h2>Most-missed questions</h2>
    ${itemPct.map(({it,p})=>`<div><span class="pill ${band(Math.round(p*100)).c}">${Math.round(p*100)}% correct</span> <span class="eyebrow">${it.id} · ${esc(TOPICS[it.topic].name)}</span><p style="margin-top:4px">${esc(it.stem)}</p></div>`).join("")}
  </section>`;
  out.querySelectorAll("th[data-k]").forEach(h=> h.onclick=()=>{ const k=h.dataset.k; T.dir = T.sort===k? -T.dir : (["name","period","rec"].includes(k)?1:-1); T.sort=k; renderTeacher(); });
  const csv = ()=> { const q=v=>`"${String(v).replace(/"/g,'""')}"`;
    const head = ["Student","Class","Date","Minutes","Correct","Overall %","GenAI Foundations %","AI-901 %","ITS AI %","Recommended exam", ...Object.keys(TOPICS).map(t=>TOPICS[t].name+" %"),"Verified"];
    return [head.map(q).join(","), ...rows.map(x=>[x.name,x.period,x.date,x.minutes,x.r.total,x.r.overall,x.r.exam.GAI,x.r.exam.AZ,x.r.exam.ITS,EXAMS[x.r.best].name,...Object.keys(TOPICS).map(t=>Math.round(x.r.topic[t].pct*100)),x.verified?"yes":"no"].map(q).join(","))].join("\n"); };
  const msg = document.getElementById("csvMsg");
  document.getElementById("copycsv").onclick = async ()=>{ try{ await navigator.clipboard.writeText(csv()); msg.textContent="Copied. Paste into Excel or Sheets."; }catch(e){ msg.textContent="Copy was blocked in this view. Use Download CSV."; } };
  const dl = document.getElementById("csv");
  (async ()=>{ const d = window.claude ? await window.claude.use("downloads").catch(()=>null) : null;
    if (d) dl.onclick = async ()=>{ try{ await d.save({filename:"ai-diagnostic-results.csv", data:csv()}); msg.textContent="Saved."; }catch(e){ msg.textContent="Download was cancelled or blocked."; } };
    else if (!window.claude) dl.onclick = ()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv()],{type:"text/csv"})); a.download="ai-diagnostic-results.csv"; a.click(); };
    else dl.hidden = true; })();
}

/* ---------- boot ---------- */
if (location.hash === "#teacher") viewTeacher();
else { const s = load(); if (s && s.end) { S = s; viewResults(); } else viewStart(); }
</script>
</body></html>
