name: Update Credly badges

on:
  schedule:
    - cron: "17 10 * * 1"   # Mondays, ~6 AM Eastern
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:
    branches: [master]
    paths:
      - scripts/update_credly.py
      - .github/workflows/update-credly.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch badges from Credly
        run: python scripts/update_credly.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/credly.json
          git diff --cached --quiet && echo "No badge changes" && exit 0
          git commit -m "Update Credly badges"
          git push
