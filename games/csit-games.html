<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play IT | Computer Systems &amp; Information Technology | iTECH</title>
<meta name="description" content="Try four quick computer games from iTECH's Computer Systems & Information Technology program: wire a network, build a PC, flip binary bits, and solve help desk tickets.">
<style>
/* ===== BRAND: swap these for iTECH colors ===== */
:root{
  --brand:#0b3d91;      /* primary */
  --brand2:#1fa3e0;     /* secondary */
  --accent:#ffb81c;     /* Apply button / highlights */
  --bg:#0a1120; --panel:#121b2d; --panel2:#18243b; --line:#2a3a58;
  --text:#eaf0f9; --muted:#9fb0c8; --ok:#2ecc71; --bad:#ff5c5c;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--brand2)}
button{font:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.top{background:var(--brand);}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.logo{background:#fff;color:var(--brand);border-radius:8px;padding:2px 10px;font-weight:900;letter-spacing:.5px}
.prog{font-size:.95rem;opacity:.95}
.lang{display:flex;gap:4px;background:rgba(0,0,0,.2);padding:3px;border-radius:999px}
.lang button{border:0;background:transparent;color:#fff;padding:5px 12px;border-radius:999px;font-size:.85rem;font-weight:600}
.lang button[aria-pressed="true"]{background:#fff;color:var(--brand)}
.hero{padding:34px 0 18px;text-align:center}
.hero h1{font-size:clamp(1.7rem,4.5vw,2.6rem);line-height:1.15;margin:0 0 10px}
.hero p{color:var(--muted);max-width:640px;margin:0 auto 18px;font-size:1.05rem}
.btn{display:inline-block;border:0;border-radius:999px;padding:11px 22px;font-weight:700;text-decoration:none;background:var(--brand2);color:#fff}
.btn.apply{background:var(--accent);color:#1a1300}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--text)}
.btn:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0 16px}
.pick{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;color:var(--text)}
.pick .ic{font-size:1.6rem}
.pick b{display:block;margin-top:4px}
.pick span{color:var(--muted);font-size:.88rem}
.pick[aria-pressed="true"]{border-color:var(--brand2);background:var(--panel2)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-height:420px}
.stage h2{margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.9rem}
.msg{min-height:1.6em;margin:12px 0;font-weight:600}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.win{background:linear-gradient(135deg,var(--brand),var(--panel2));border-radius:var(--radius);padding:16px;margin-top:12px;text-align:center}
.win p{margin:6px 0 12px}
.cta{margin:26px 0;padding:26px 18px;text-align:center;border-radius:var(--radius);background:linear-gradient(135deg,var(--brand),#06213f)}
.cta h2{margin:0 0 6px}
.cta p{margin:0 auto 16px;max-width:620px;color:#d6e2f3}
.cta .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:10px 0 30px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Cable Connect */
.grid{display:grid;gap:3px;margin:0 auto;max-width:440px;touch-action:manipulation}
.tile{aspect-ratio:1;background:var(--panel2);border:0;border-radius:8px;padding:0}
.tile svg{width:100%;height:100%;display:block}
.tile g.pipe{transition:transform .15s ease;transform-origin:50px 50px}
.tile .ln{stroke:#4b5d80;stroke-width:14;stroke-linecap:round}
.tile.lit .ln{stroke:var(--ok)}
.tile .dev{fill:#4b5d80}.tile.lit .dev{fill:var(--ok)}
.tile .srv{fill:var(--accent)}
.solved .tile{background:#123a2a}

/* Build a PC */
.pcwrap{display:grid;grid-template-columns:1fr 1.3fr;gap:16px}
@media(max-width:700px){.pcwrap{grid-template-columns:1fr}}
.tray{display:grid;gap:8px}
.part{display:flex;gap:10px;align-items:center;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:10px;color:var(--text);text-align:left}
.part .ic{font-size:1.5rem}
.part[aria-pressed="true"]{border-color:var(--accent)}
.part.done{opacity:.35;pointer-events:none}
.board{background:#0f3b2b;border:3px solid #1f6b4f;border-radius:12px;padding:10px;display:grid;gap:8px;
  grid-template-columns:1fr 1fr 1fr;grid-template-areas:"cpu cpu ram" "cpu cpu ram" "m2 pcie pcie" "pwr pwr pwr"}
.slot{border:2px dashed #6fd3a8;background:rgba(0,0,0,.25);color:#cfeee0;border-radius:8px;min-height:64px;padding:6px;font-size:.85rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.slot.filled{border-style:solid;background:#1d6b4c;color:#fff}
.slot .ic{font-size:1.4rem}
.post{font-family:ui-monospace,Consolas,monospace;background:#000;color:#7CFC00;border-radius:8px;padding:12px;white-space:pre-wrap;min-height:120px;margin-top:12px}

/* Binary */
.bits{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-width:560px;margin:0 auto}
.bit{background:var(--panel2);border:2px solid var(--line);border-radius:10px;color:var(--text);padding:10px 0}
.bit b{display:block;font-size:1.6rem;font-family:ui-monospace,Consolas,monospace}
.bit small{color:var(--muted)}
.bit.on{background:var(--brand2);border-color:var(--brand2)}
.bit.on small{color:#e6f6ff}
.target{text-align:center;font-size:1.1rem;margin:10px 0}
.target b{font-size:2.6rem;display:block;color:var(--accent)}
.val{text-align:center;color:var(--muted);margin-top:10px}

/* Help desk */
.ticket{background:var(--panel2);border-left:5px solid var(--accent);border-radius:10px;padding:14px;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:12px;color:var(--text);text-align:left}
.opt.right{border-color:var(--ok);background:#123a2a}
.opt.wrong{border-color:var(--bad);background:#3a1717}
.center{text-align:center}
</style>
</head>

/* ===================== GAME 1: CABLE CONNECT ===================== */
const DIRS=[[0,-1,1],[1,0,2],[0,1,4],[-1,0,8]];
const OPP={1:4,2:8,4:1,8:2};
const rot = m => ((m<<1)|(m>>3))&15;
const rotN = (m,n) => { for(let i=0;i<(n%4);i++) m=rot(m); return m; };
const cable = { level:0, sizes:[4,5,6,7] };
function genCable(n){
  const base=Array(n*n).fill(0), sx=n>>1, sy=n>>1, seen=new Set([sy*n+sx]), fr=[];
  const add=(x,y)=>{for(const[dx,dy,b] of DIRS){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<n&&ny<n&&!seen.has(ny*n+nx))fr.push([x,y,nx,ny,b])}};
  add(sx,sy);
  while(seen.size<n*n){
    const [x,y,nx,ny,b]=fr.splice(Math.floor(Math.random()*fr.length),1)[0];
    const k=ny*n+nx; if(seen.has(k)) continue;
    base[y*n+x]|=b; base[k]|=OPP[b]; seen.add(k); add(nx,ny);
  }
  const r=base.map(()=>Math.floor(Math.random()*4));
  const p={n,sx,sy,base,r,moves:0};
  if(checkCable(p).solved){ const i=base.findIndex(m=>m!==5&&m!==10&&m!==15); if(i>=0) r[i]++; }
  return p;
}
function checkCable(p){
  const {n}=p, cur=p.base.map((m,i)=>rotN(m,p.r[i])), s=p.sy*n+p.sx, vis=new Set([s]), q=[s]; let dang=false;
  while(q.length){const k=q.shift(),x=k%n,y=(k/n)|0;
    for(const[dx,dy,b] of DIRS){ if(!(cur[k]&b)) continue; const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=n||ny>=n){dang=true;continue}
      const nk=ny*n+nx; if(!(cur[nk]&OPP[b])){dang=true;continue}
      if(!vis.has(nk)){vis.add(nk);q.push(nk)} } }
  return {vis,solved:vis.size===n*n&&!dang};
}
function tileSVG(m,isSrv){
  const deg=[1,2,4,8].filter(b=>m&b).length;
  const ends={1:[50,0],2:[100,50],4:[50,100],8:[0,50]};
  let s='<svg viewBox="0 0 100 100" aria-hidden="true"><g class="pipe">';
  for(const b of [1,2,4,8]) if(m&b){const[x,y]=ends[b]; s+=`<line class="ln" x1="50" y1="50" x2="${x}" y2="${y}"/>`;}
  s+='</g><g>';
  if(isSrv) s+='<rect class="srv" x="28" y="24" width="44" height="52" rx="6"/><rect x="34" y="32" width="32" height="6" fill="#1a1300"/><rect x="34" y="44" width="32" height="6" fill="#1a1300"/><circle cx="60" cy="64" r="4" fill="#1a1300"/>';
  else if(deg===1) s+='<rect class="dev" x="26" y="28" width="48" height="34" rx="4"/><rect x="31" y="33" width="38" height="24" fill="#0a1120"/><rect class="dev" x="40" y="62" width="20" height="10"/>';
  else s+='<circle class="dev" cx="50" cy="50" r="9"/>';
  return s+'</g></svg>';
}
function mountCable(el){
  const p = cable.p || (cable.p = genCable(cable.sizes[cable.level]));
  el.innerHTML = `<h2>🔌 ${t("g_cable")}</h2><p class="sub">${t("cable_sub")}</p>
   <div class="bar"><span class="chip">${t("level")} <b>${cable.level+1}</b> / ${cable.sizes.length}</span>
   <span class="chip">${t("moves")} <b id="cm">${p.moves}</b></span>
   <button class="btn ghost" id="cnew">${t("new_puzzle")}</button></div>
   <div class="grid" id="cg" style="grid-template-columns:repeat(${p.n},1fr)"></div><div id="cwin"></div>`;
  const g=$("#cg",el), tiles=[];
  p.base.forEach((m,i)=>{
    const isSrv = i===p.sy*p.n+p.sx;
    const b=h(`<button class="tile" aria-label="tile ${i+1}">${tileSVG(m,isSrv)}</button>`);
    b.onclick=()=>{ if(g.classList.contains("solved")) return; p.r[i]++; p.moves++; $("#cm",el).textContent=p.moves; paint(); };
    g.appendChild(b); tiles.push(b);
  });
  function paint(){
    const {vis,solved}=checkCable(p);
    tiles.forEach((b,i)=>{ $("g.pipe",b).style.transform=`rotate(${p.r[i]*90}deg)`; b.classList.toggle("lit",vis.has(i)); });
    if(solved){ g.classList.add("solved");
      const last = cable.level===cable.sizes.length-1;
      $("#cwin",el).innerHTML = `<p class="msg ok center">✅ ${t("cable_win")}</p><div class="center"><button class="btn" id="cnext">${last?t("play_again"):t("next_level")}</button></div>${last?nudge():""}`;
      $("#cnext",el).onclick=()=>{ cable.level = last?0:cable.level+1; cable.p=null; mountCable(el); };
    }
  }
  $("#cnew",el).onclick=()=>{ cable.p=null; mountCable(el); };
  paint();
}

/* ===================== GAME 2: BUILD-A-PC ===================== */
const PARTS=[{id:"cpu",ic:"🧠",slot:"cpu"},{id:"ram",ic:"📏",slot:"ram"},{id:"ssd",ic:"💾",slot:"m2"},{id:"gpu",ic:"🎮",slot:"pcie"},{id:"psu",ic:"⚡",slot:"pwr"}];
const pc = { placed:{} };
function mountPC(el){
  let sel=null;
  el.innerHTML = `<h2>🖥️ ${t("g_pc")}</h2><p class="sub">${t("pc_sub")}</p>
   <div class="pcwrap"><div class="tray" id="tray"></div>
   <div><div class="board" id="board">
     ${["cpu","ram","m2","pcie","pwr"].map(s=>`<button class="slot" data-s="${s}" style="grid-area:${s}"><span class="ic"></span><span>${t("s_"+s)}</span></button>`).join("")}
   </div></div></div>
   <p class="msg" id="pmsg"></p><div id="pend"></div>`;
  const tray=$("#tray",el), msg=$("#pmsg",el);
  PARTS.forEach(p=>{
    const b=h(`<button class="part" data-p="${p.id}"><span class="ic">${p.ic}</span><span><b>${t("p_"+p.id)}</b><br><small>${t("d_"+p.id)}</small></span></button>`);
    b.onclick=()=>{ sel=p; tray.querySelectorAll(".part").forEach(x=>x.setAttribute("aria-pressed",x===b)); msg.textContent=""; };
    tray.appendChild(b);
  });
  const refresh=()=>{
    PARTS.forEach(p=>{ if(pc.placed[p.id]){ tray.querySelector(`[data-p="${p.id}"]`).classList.add("done");
      const s=el.querySelector(`[data-s="${p.slot}"]`); s.classList.add("filled"); $(".ic",s).textContent=p.ic; $("span:last-child",s).textContent=t("p_"+p.id); }});
    if(Object.keys(pc.placed).length===PARTS.length && !$("#pwrbtn",el)){
      msg.className="msg ok"; msg.textContent=t("pc_done");
      $("#pend",el).innerHTML=`<div class="center"><button class="btn apply" id="pwrbtn">⏻ ${t("pc_power")}</button></div><div class="post" id="post" hidden></div>`;
      $("#pwrbtn",el).onclick=boot;
    }
  };
  el.querySelectorAll(".slot").forEach(s=>s.onclick=()=>{
    if(s.classList.contains("filled")) return;
    if(!sel){ msg.className="msg bad"; msg.textContent=t("pc_pick"); return; }
    if(sel.slot===s.dataset.s){ pc.placed[sel.id]=1; sel=null; msg.className="msg ok"; msg.textContent=t("correct"); refresh(); }
    else { msg.className="msg bad"; msg.textContent=t("pc_wrong"); s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake"); }
  });
  function boot(){
    const post=$("#post",el); post.hidden=false; $("#pwrbtn",el).disabled=true;
    const lines=["iTECH BIOS v1.0","CPU ............ OK","Memory 16 GB .... OK","M.2 SSD 1 TB .... OK","Graphics ........ OK","Power ........... OK","","Booting operating system..."];
    let i=0; const iv=setInterval(()=>{ post.textContent+=lines[i++]+"\n"; if(i>=lines.length){ clearInterval(iv);
      $("#pend",el).insertAdjacentHTML("beforeend",`<p class="msg ok center">🎉 ${t("pc_boot")}</p><div class="center"><button class="btn ghost" id="preset">${t("play_again")}</button></div>${nudge()}`);
      $("#preset",el).onclick=()=>{ pc.placed={}; mountPC(el); }; } },260);
  }
  refresh();
}

/* ===================== GAME 3: BINARY BLITZ ===================== */
const bin = {};
function mountBin(el){
  clearInterval(bin.iv);
  el.innerHTML = `<h2>🔢 ${t("g_bin")}</h2><p class="sub">${t("bin_sub")}</p>
   <div class="bar"><span class="chip">${t("time")} <b id="bt">60</b>s</span><span class="chip">${t("score")} <b id="bs">0</b></span></div>
   <div class="target">${t("target")}<b id="btg">?</b></div>
   <div class="bits" id="bits">${[128,64,32,16,8,4,2,1].map(v=>`<button class="bit" data-v="${v}" disabled><b>0</b><small>${v}</small></button>`).join("")}</div>
   <div class="val">${t("value")}: <b id="bv">0</b></div>
   <div class="center" style="margin-top:14px"><button class="btn apply" id="bstart">${t("start")}</button></div><div id="bend"></div>`;
  const bits=[...el.querySelectorAll(".bit")];
  let val=0,target=0,score=0,time=60,round=0;
  const newT=()=>{ round++; const max = round<3?15:round<6?63:255; let n; do{n=1+Math.floor(Math.random()*max)}while(n===target); target=n; $("#btg",el).textContent=target; };
  const setVal=()=>{ val=bits.reduce((a,b)=>a+(b.classList.contains("on")?+b.dataset.v:0),0); $("#bv",el).textContent=val; };
  bits.forEach(b=>b.onclick=()=>{ b.classList.toggle("on"); $("b",b).textContent=b.classList.contains("on")?1:0; setVal();
    if(val===target){ score++; $("#bs",el).textContent=score; bits.forEach(x=>{x.classList.remove("on");$("b",x).textContent=0}); setVal(); newT(); } });
  $("#bstart",el).onclick=()=>{
    $("#bstart",el).parentElement.hidden=true; bits.forEach(b=>b.disabled=false); newT();
    bin.iv=setInterval(()=>{ time--; $("#bt",el).textContent=time; if(time<=0){ clearInterval(bin.iv); bits.forEach(b=>b.disabled=true);
      $("#bend",el).innerHTML=`<p class="msg ok center">⏱️ ${fmt(t("bin_over"),{n:score})}</p><div class="center"><button class="btn ghost" id="bagain">${t("play_again")}</button></div>${nudge()}`;
      $("#bagain",el).onclick=()=>mountBin(el); } },1000);
  };
}

/* ===================== GAME 4: HELP DESK HERO ===================== */
function mountHelp(el){
  const list=t("tickets"); let i=0, score=0;
  const show=()=>{
    if(i>=list.length){ el.innerHTML=`<h2>🎧 ${t("g_help")}</h2><p class="msg ok center">🏆 ${fmt(t("help_over"),{n:score,t:list.length})}</p><div class="center"><button class="btn ghost" id="hagain">${t("play_again")}</button></div>${nudge()}`; $("#hagain",el).onclick=()=>mountHelp(el); return; }
    const k=list[i];
    el.innerHTML=`<h2>🎧 ${t("g_help")}</h2><p class="sub">${t("help_sub")}</p>
      <div class="bar"><span class="chip">${t("ticket")} <b>${i+1}</b> / ${list.length}</span><span class="chip">${t("score")} <b>${score}</b></span></div>
      <div class="ticket">🎫 ${k.q}</div><div class="opts">${k.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}</div>
      <p class="msg" id="hmsg"></p><div id="hnext"></div>`;
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j; el.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(+x.dataset.j===k.a) x.classList.add("right");});
      const m=$("#hmsg",el);
      if(j===k.a){ score++; m.className="msg ok"; m.textContent=t("correct")+" "+k.e; } else { b.classList.add("wrong"); m.className="msg bad"; m.textContent=k.e; }
      $("#hnext",el).innerHTML=`<button class="btn">${t("next")} →</button>`; $("#hnext button",el).onclick=()=>{i++;show();};
    });
  };
  show();
}

/* ===================== SHELL ===================== */
const GAMES=[{id:"cable",ic:"🔌",mount:mountCable},{id:"pc",ic:"🖥️",mount:mountPC},{id:"bin",ic:"🔢",mount:mountBin},{id:"help",ic:"🎧",mount:mountHelp}];
let current="cable";
function renderPicker(){
  $("#picker").innerHTML=GAMES.map(g=>`<button class="pick" data-g="${g.id}" aria-pressed="${g.id===current}"><span class="ic">${g.ic}</span><b>${t("g_"+g.id)}</b><span>${t("g_"+g.id+"_d")}</span></button>`).join("");
  document.querySelectorAll(".pick").forEach(b=>b.onclick=()=>{ current=b.dataset.g; renderPicker(); mountGame(); $("#stage").scrollIntoView({behavior:"smooth",block:"start"}); });
}
function mountGame(){ clearInterval(bin.iv); GAMES.find(g=>g.id===current).mount($("#stage")); }
function applyLang(){
  document.documentElement.lang = lang==="ht"?"ht":lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  renderPicker(); mountGame();
}
document.querySelectorAll("[data-apply]").forEach(a=>{a.href=CONFIG.applyUrl;a.target="_blank";a.rel="noopener"});
document.querySelectorAll("[data-other]").forEach(a=>a.href=CONFIG.otherPage);
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; try{localStorage.setItem("itech_lang",lang)}catch(e){} applyLang(); });
applyLang();
</script>
